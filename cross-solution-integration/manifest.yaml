id: cross-solution-integration
name: Cross-Solution Integration
description: Integration layer that connects the Tier 2 governance solutions into the Compliance Dashboard and Environment Lifecycle Management workflow.
version: 2.0.3
status: live
domain: compliance-audit
tier: '2'
controls:
- '1.7'
- '1.23'
- '1.11'
- '3.8'
- '1.8'
- '1.14'
- '1.18'
url: https://judeper.github.io/FSI-AgentGov-Solutions/solutions/cross-solution-integration/
prerequisites:
  power-platform-admin: "Power Platform admin tenant role for Dataverse tables, Power Automate flows, and solution imports."
  m365-admin: "Power BI workspace owner or dashboard admin for the Compliance Dashboard integration."
  global-reader: "Read-only visibility for source-solution and tenant configuration checks during sync validation."
verification: "Run Sync-SolutionAssessments.ps1 and confirm rows are written or updated in fsi_controlassessments for the expected control IDs, with the Power Automate feed collector completing successfully."
dependencies:
- agent-observability-foundation

# zones/dataClassification CONFIRMED 2026-Q2 (issue #37):
#   wires Tier 2 solutions into Compliance Dashboard; spans all zones via dashboard scope
zones:
- personal
- team
- enterprise
dataClassification: internal
