id: agent-observability-foundation
name: Agent Observability Foundation
description: FSI-compliant telemetry infrastructure for Microsoft Copilot Studio agents with long-term audit retention, operational workbooks, and proactive alerting.
version: 1.2.4
status: live
domain: monitoring-analytics
tier: '1'
controls:
- '1.7'
- '2.8'
- '2.9'
- '3.2'
url: https://judeper.github.io/FSI-AgentGov-Solutions/solutions/agent-observability-foundation/
prerequisites:
  log-analytics-reader: Reader access to the Log Analytics workspace and Application Insights for queries and validation.
  power-platform-admin: Power Platform admin tenant role for Copilot Studio telemetry source configuration.
  m365-admin: Azure subscription Contributor/User Access Admin scoped to the resource group for deployment and resource creation.
verification: Confirm Copilot Studio telemetry arrives in Application Insights AppEvents or legacy customEvents within 24h and workbooks/alerts render without errors.

# zones/dataClassification CONFIRMED 2026-Q2 (issue #37):
#   foundational observability; required wherever agents run
zones:
- personal
- team
- enterprise
dataClassification: internal
