name: agent-intake CI

on:
  pull_request:
    paths:
      - 'agent-intake/**'
      - '.github/workflows/agent-intake-ci.yml'
      - 'scripts/manifest.schema.json'
      - 'scripts/lint-odata-columns.py'
  push:
    branches: [main]
    paths:
      - 'agent-intake/**'
      - '.github/workflows/agent-intake-ci.yml'
      - 'scripts/manifest.schema.json'
      - 'scripts/lint-odata-columns.py'

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pyyaml jsonschema

      - name: Compile-check Python sources
        run: python -m compileall -f -q agent-intake/scripts agent-intake/tests

      - name: Ruff (agent-intake tests)
        run: ruff check agent-intake/tests

      - name: Ruff (agent-intake scripts)
        continue-on-error: true
        # Soft-gated while the existing script baseline is cleaned up.
        run: ruff check agent-intake/scripts

      - name: Validate JSON templates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          template_dir = Path('agent-intake/templates')
          json_paths = sorted(template_dir.glob('*.json'))
          if not json_paths:
              raise SystemExit('No JSON templates found under agent-intake/templates')

          for path in json_paths:
              with path.open(encoding='utf-8') as handle:
                  json.load(handle)

          print(f'Validated {len(json_paths)} JSON template(s).')
          PY

      - name: Dataverse schema script dry-run or compile-check
        run: |
          if python agent-intake/scripts/create_fsi_intake_dataverse_schema.py --help | grep -q -- '--dry-run' && [ -n "${INTAKE_ENVIRONMENT_URL:-}" ]; then
            cmd=(python agent-intake/scripts/create_fsi_intake_dataverse_schema.py --dry-run --environment-url "$INTAKE_ENVIRONMENT_URL")
            if [ -n "${INTAKE_TENANT_ID:-}" ]; then
              cmd+=(--tenant-id "$INTAKE_TENANT_ID")
            fi
            if [ -n "${INTAKE_CLIENT_ID:-}" ]; then
              cmd+=(--client-id "$INTAKE_CLIENT_ID")
            fi
            "${cmd[@]}"
          else
            python -m py_compile agent-intake/scripts/create_fsi_intake_dataverse_schema.py
          fi

      - name: Classification self-test
        run: python agent-intake/scripts/seed_classification_rules.py --self-test

      - name: Pytest - classification rules
        run: python -m pytest agent-intake/tests/test_classification_rules.py -v

      - name: Validate question catalogs against schema
        continue-on-error: true
        # Soft-gated while the question-catalog and schema workstreams converge on
        # first-class Standard and Full path field coverage.
        run: python agent-intake/tests/validators/validate_question_catalogs.py

      - name: Validate Adaptive Card templates
        run: python agent-intake/tests/validators/validate_adaptive_cards.py

      - name: Validate solution manifest
        run: python agent-intake/tests/validators/validate_manifest.py

      - name: Validate policy lookup YAML
        continue-on-error: true
        # Soft-gated while the policy foundation workstream adds the final
        # connector allowlist block expected by the solution CI contract.
        run: python agent-intake/tests/validators/validate_policy_yaml.py

      - name: Pytest - validator smoke suite
        continue-on-error: true
        # Mirrors the honest validator exit codes above so parallel workstreams can
        # see source drift without blocking unrelated CI fixes in this branch.
        run: python -m pytest agent-intake/tests/validators/test_validators_smoke.py -v

  powershell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser

      - name: Parse-validate PowerShell
        shell: pwsh
        run: |
          $errors = 0
          Get-ChildItem -Path agent-intake -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errs = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errs) | Out-Null
            if ($errs.Count -gt 0) {
              Write-Host "PARSE FAIL: $($_.FullName)"
              $errs | ForEach-Object { Write-Host "  $_" }
              $errors++
            }
          }
          if ($errors -gt 0) { exit 1 }

      - name: PSScriptAnalyzer
        shell: pwsh
        continue-on-error: true
        # Soft-gated while the existing PowerShell baseline is cleaned up.
        run: |
          $issues = Get-ChildItem -Path agent-intake/scripts -Recurse -Filter *.ps1 |
            ForEach-Object { Invoke-ScriptAnalyzer -Path $_.FullName -Severity Error,Warning }
          if ($issues) {
            $issues | Format-Table -AutoSize
            exit 1
          }

  language-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Banned compliance phrases
        shell: bash
        run: |
          set -euo pipefail
          rule_one_prefix='ensures'
          rule_one_suffix=' compliance'
          rule_one="${rule_one_prefix}${rule_one_suffix}"
          guarantee_root='guaran'
          guarantee_base="${guarantee_root}tee"
          rule_two="${guarantee_base}s compliance"
          rule_two_alt="${guarantee_base} compliance"
          action_word='will'
          outcome_word='prevent'
          rule_three="${action_word} ${outcome_word}"
          remove_word='eliminates'
          risk_word='risk'
          rule_four="${remove_word} ${risk_word}"
          patterns="${rule_one}|${rule_two}|${rule_two_alt}|${rule_three}|${rule_four}"
          dir_hits=$(grep -rEn \
            --include='*.md' \
            --include='*.py' \
            --include='*.ps1' \
            --include='*.json' \
            --include='*.yaml' \
            --exclude='CHANGELOG.md' \
            "$patterns" agent-intake || true)
          workflow_hits=$(grep -nE "$patterns" .github/workflows/agent-intake-ci.yml || true)
          hits=$(printf '%s\n%s\n' "$dir_hits" "$workflow_hits" | sed '/^$/d')
          if [ -n "$hits" ]; then
            echo '::error::Banned compliance phrases found:'
            echo "$hits"
            exit 1
          fi
          echo 'OK: no banned compliance phrases.'

      - name: Banned product naming
        shell: bash
        run: |
          set -euo pipefail
          legacy_left='Azure'
          legacy_right='AD'
          legacy_pattern="\\b${legacy_left} ${legacy_right}\\b"
          dir_hits=$(grep -rEn \
            --include='*.md' \
            --include='*.py' \
            --include='*.ps1' \
            --include='*.json' \
            --include='*.yaml' \
            --exclude='CHANGELOG.md' \
            "$legacy_pattern" agent-intake || true)
          workflow_hits=$(grep -nE "$legacy_pattern" .github/workflows/agent-intake-ci.yml || true)
          hits=$(printf '%s\n%s\n' "$dir_hits" "$workflow_hits" | sed '/^$/d')
          if [ -n "$hits" ]; then
            echo "::error::'${legacy_left} ${legacy_right}' found outside CHANGELOG history (use 'Microsoft Entra ID'):"
            echo "$hits"
            exit 1
          fi
          echo "OK: no '${legacy_left} ${legacy_right}' references outside CHANGELOG history."

  odata-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dataverse logical-name lint
        run: python scripts/lint-odata-columns.py --solution agent-intake --strict

  changelog:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require [Unreleased] section
        shell: bash
        run: |
          if ! grep -q '^##\s\[Unreleased\]' agent-intake/CHANGELOG.md; then
            echo 'agent-intake/CHANGELOG.md must have an [Unreleased] section'
            exit 1
          fi
