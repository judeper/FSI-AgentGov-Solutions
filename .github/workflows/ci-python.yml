name: Python CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pyyaml jsonschema

      - name: Compile-check all Python sources
        run: |
          python -m compileall -q scripts */scripts || true
          python -m compileall -f -q scripts/build-manifest.py scripts/_backfill-zones.py

      - name: Ruff (lint)
        # Wave 6 P6 (2026-05-23): flipped strict. pyproject.toml pins the
        # active rule set (E4, E7, E9, F, W). Baseline cleared to 0 findings.
        run: ruff check scripts */scripts

      - name: Pytest - message-center-monitor (HARD-GATED)
        # Hard gate: message-center-monitor v2.4.0 schema script (create_keys
        # alternate-key creation) ships with pytest cases under
        # message-center-monitor/tests. They MUST pass.
        run: |
          if [ ! -d message-center-monitor/tests ]; then
            echo "message-center-monitor/tests not present; skipping (will be added in v2.4.0)."
            exit 0
          fi
          if ! ls message-center-monitor/tests/test_*.py >/dev/null 2>&1; then
            echo "No pytest files in message-center-monitor/tests; skipping."
            exit 0
          fi
          # The schema script imports `requests` and `msal` at module top.
          # These are runtime deps of the solution itself (not test deps), so
          # install them just before running the hard-gated suite.
          pip install requests msal
          pytest -q message-center-monitor/tests

      - name: Pytest (repo-wide)
        # Wave 6 P6 (2026-05-23): flipped strict. The "sys.exit() at import
        # time" claim in the previous comment is obsolete: those exits are
        # inside `try/except ImportError` blocks that fire only when runtime
        # deps are missing. With `pip install requests msal azure-identity`
        # (covers every solution script that pytest will transitively import)
        # and pytest's `--import-mode=importlib` (avoids module-name
        # collisions across solutions with top-level `tests/` directories),
        # the full repo-wide suite passes (189 pass / 2 skip / 0 fail as of
        # close-out).
        run: |
          # Runtime deps of solution scripts that pytest imports
          pip install requests msal azure-identity jinja2
          test_files=$(git ls-files '*test_*.py' '*_test.py' '**/tests/**/*.py' | grep -v '^message-center-monitor/tests/' | head -50)
          if [ -z "$test_files" ]; then
            echo "No additional pytest files discovered; skipping."
            exit 0
          fi
          pytest -q \
            --import-mode=importlib \
            --ignore=message-center-monitor/tests \
            $test_files
