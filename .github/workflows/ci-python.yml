name: Python CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pyyaml jsonschema

      - name: Compile-check all Python sources
        run: |
          python -m compileall -q scripts */scripts || true
          python -m compileall -f -q scripts/build-manifest.py scripts/_backfill-zones.py

      - name: Ruff (lint)
        # Soft-gate to start: report findings but do not fail CI yet.
        # Flip to `--exit-non-zero-on-fix` and remove `|| true` once baseline is clean.
        run: ruff check scripts */scripts || true

      - name: Pytest - message-center-monitor (HARD-GATED)
        # Hard gate: message-center-monitor v2.4.0 schema script (create_keys
        # alternate-key creation) ships with pytest cases under
        # message-center-monitor/tests. They MUST pass.
        run: |
          if [ ! -d message-center-monitor/tests ]; then
            echo "message-center-monitor/tests not present; skipping (will be added in v2.4.0)."
            exit 0
          fi
          if ! ls message-center-monitor/tests/test_*.py >/dev/null 2>&1; then
            echo "No pytest files in message-center-monitor/tests; skipping."
            exit 0
          fi
          # The schema script imports `requests` and `msal` at module top.
          # These are runtime deps of the solution itself (not test deps), so
          # install them just before running the hard-gated suite.
          pip install requests msal
          pytest -q message-center-monitor/tests

      - name: Pytest (repo-wide, soft-gated baseline)
        # Soft-gate: pre-existing test files (e.g.
        # finra-supervision-workflow/scripts/test_export_supervision_evidence.py)
        # call sys.exit() at import time when env vars are missing, which
        # crashes pytest collection. Until those tests are refactored, run
        # pytest with --continue-on-collection-errors and ignore known-broken
        # test files. Tracked separately from this PR.
        continue-on-error: true
        run: |
          set +e
          test_files=$(git ls-files '*test_*.py' '*_test.py' '**/tests/**/*.py' | grep -v '^message-center-monitor/tests/' | head -50)
          if [ -z "$test_files" ]; then
            echo "No additional pytest files discovered; skipping."
            exit 0
          fi
          pytest -q \
            --continue-on-collection-errors \
            --ignore=message-center-monitor/tests \
            --ignore=finra-supervision-workflow/scripts/test_export_supervision_evidence.py \
            || echo "::warning::pytest reported failures (soft-gated)."
