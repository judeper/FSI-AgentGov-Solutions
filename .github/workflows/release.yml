name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag or commit to release from"
        required: true
        default: "main"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Build SBOM and signed release artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Compute version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate source tarball
        run: |
          mkdir -p dist
          git archive --format=tar.gz \
            --prefix="FSI-AgentGov-Solutions-${{ steps.version.outputs.version }}/" \
            -o "dist/FSI-AgentGov-Solutions-${{ steps.version.outputs.version }}.tar.gz" \
            HEAD

      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: dist/sbom.spdx.json

      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: dist/sbom.cyclonedx.json

      - name: Compute SHA-256 manifest
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Generate build provenance attestation
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: |
            dist/FSI-AgentGov-Solutions-*.tar.gz
            dist/sbom.spdx.json
            dist/sbom.cyclonedx.json

      - name: Upload artifacts to workflow run
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.version.outputs.version }}
          path: dist/

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/FSI-AgentGov-Solutions-*.tar.gz
            dist/sbom.spdx.json
            dist/sbom.cyclonedx.json
            dist/SHA256SUMS
          generate_release_notes: true
