name: Dependency Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        # Hard gate (Wave 6 P6 — 2026-05-23): vulnerability alerts are now
        # enabled at the repo level, so the dependency graph feeds real
        # advisory data into this action. PRs with high-severity
        # vulnerabilities or incompatible licenses now block.
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
