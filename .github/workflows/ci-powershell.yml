name: PowerShell CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  powershell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer + Pester
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser
          Install-Module -Name Pester -Force -Scope CurrentUser -SkipPublisherCheck

      - name: Parse-validate every .ps1
        shell: pwsh
        run: |
          $errors = 0
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null; $errs = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$tokens, [ref]$errs) | Out-Null
            if ($errs.Count -gt 0) {
              Write-Host "PARSE FAIL: $($_.FullName)"
              $errs | ForEach-Object { Write-Host "  $_" }
              $errors++
            }
          }
          if ($errors -gt 0) { exit 1 }

      - name: PSScriptAnalyzer
        shell: pwsh
        # Hard gate (Wave 6 P6 — 2026-05-23): loads the project-level
        # PSScriptAnalyzerSettings.psd1 (excludes PSAvoidUsingWriteHost +
        # PSUseSingularNouns) and fails the build on any Warning- or
        # Error-severity finding. Wave 6 drove the baseline to 0 findings;
        # this gate keeps it there.
        run: |
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error,Warning -Settings ./PSScriptAnalyzerSettings.psd1
          $results | Format-Table -AutoSize
          if ($results.Count -gt 0) {
            Write-Host "::error::PSScriptAnalyzer reported $($results.Count) Warning+Error finding(s)."
            exit 1
          }

      - name: Pester - message-center-monitor (HARD-GATED)
        shell: pwsh
        # Hard gate: the message-center-monitor v2.4.0 fix (C1 admin-field
        # preservation, retry on 5xx, Retry-After parsing on PS7) ships with
        # mock unit tests under message-center-monitor/tests. They MUST pass.
        run: |
          $testRoot = Join-Path $PWD 'message-center-monitor/tests'
          if (-not (Test-Path $testRoot)) {
            Write-Host "message-center-monitor/tests not present; skipping (will be added in v2.4.0)."
            exit 0
          }
          $tests = Get-ChildItem -Path $testRoot -Recurse -Filter '*.Tests.ps1' -ErrorAction SilentlyContinue
          if (-not $tests) {
            Write-Host "No Pester tests in message-center-monitor/tests; skipping."
            exit 0
          }
          $cfg = New-PesterConfiguration
          $cfg.Run.Path = $tests.FullName
          $cfg.Run.Exit = $true
          $cfg.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $cfg

      - name: Pester (repo-wide)
        shell: pwsh
        # Hard gate (Wave 6 P6 — 2026-05-23): repo-wide Pester is now
        # required. The Wave 6 baseline (audit-compliance-manager
        # Validators.Tests.ps1) was fixed and the broader suite is green
        # (102 pass / 0 fail at flip-time).
        run: |
          $tests = Get-ChildItem -Recurse -Filter '*.Tests.ps1' -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notmatch '[\\/]message-center-monitor[\\/]tests[\\/]' }
          if (-not $tests) {
            Write-Host "No additional Pester tests discovered; skipping."
            exit 0
          }
          $cfg = New-PesterConfiguration
          $cfg.Run.Path = $tests.FullName
          $cfg.Run.Exit = $true
          $cfg.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $cfg
