name: Language Rules

# Enforces the FSI compliance-language guidelines defined in
# .github/instructions/fsi-language-rules.instructions.md.
#
# Banned phrases imply legal guarantees the framework does not make:
#   - "ensures compliance" / "guarantees" / "will prevent" / "eliminates risk"
# Banned product naming (legacy Microsoft branding):
#   - "Azure AD" (use "Microsoft Entra ID")
#
# CHANGELOG.md history is exempt — historical entries may reference the
# legacy names verbatim.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  language-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate language rules
        run: python scripts/validate-language-rules.py
