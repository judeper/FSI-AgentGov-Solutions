name: Publish Docs

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: solutions

      - name: Checkout framework for control validation
        uses: actions/checkout@v4
        with:
          repository: judeper/FSI-AgentGov
          # Pinned to a framework release tag; bump deliberately. Do NOT use 'main'.
          ref: ${{ vars.FRAMEWORK_REF || 'v1.6.0' }}
          path: fsi-agentgov

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: solutions/requirements-docs.txt

      - working-directory: solutions
        run: pip install -r requirements-docs.txt jsonschema

      - working-directory: solutions
        env:
          FRAMEWORK_CONTROLS: ${{ github.workspace }}/fsi-agentgov/assessment/manifest/controls.json
        run: python scripts/build-manifest.py

      - working-directory: solutions
        run: mkdocs build --strict

      - uses: actions/upload-pages-artifact@v3
        with:
          path: solutions/site/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
