name: Manifest Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  manifest-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: solutions

      - name: Checkout framework (controls.json source of truth)
        uses: actions/checkout@v4
        with:
          repository: judeper/FSI-AgentGov
          # Pinned to a framework release tag; bump deliberately. Do NOT use 'main'.
          ref: ${{ vars.FRAMEWORK_REF || 'v1.4.0' }}
          path: fsi-agentgov

      - name: Reject stale framework pillar path segments
        working-directory: solutions
        run: |
          if grep -rE 'pillar-(1-foundation|2-lifecycle|3-monitoring)' --include='*.md' --include='*.yaml' --include='*.yml' . ; then
            echo "Stale pillar path segment found"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install pyyaml jsonschema

      - name: Verify committed artifacts are in sync with manifests
        # MUST run BEFORE any step that regenerates artifacts. `--check`
        # compares freshly generated content against the files ON DISK, so a
        # preceding `build-manifest.py` run would overwrite the committed
        # artifacts and make this gate compare generator output to itself --
        # silently passing on any committed drift (found in issue #205).
        working-directory: solutions
        env:
          FRAMEWORK_CONTROLS: ${{ github.workspace }}/fsi-agentgov/assessment/manifest/controls.json
        run: python scripts/build-manifest.py --check

      - name: Generate artifacts (writes gitignored site-docs)
        working-directory: solutions
        env:
          FRAMEWORK_CONTROLS: ${{ github.workspace }}/fsi-agentgov/assessment/manifest/controls.json
        run: python scripts/build-manifest.py

      - name: Verify generator is deterministic
        # Second `--check`, this time against the just-generated output, so a
        # non-deterministic generator still fails the build.
        working-directory: solutions
        env:
          FRAMEWORK_CONTROLS: ${{ github.workspace }}/fsi-agentgov/assessment/manifest/controls.json
        run: python scripts/build-manifest.py --check

      - name: Confirm generation left no uncommitted changes to tracked files
        working-directory: solutions
        run: git diff --exit-code

      - name: Verify AGENTS.md and copilot-instructions.md inventory tables match solutions.json
        working-directory: solutions
        run: python scripts/sync-agent-md-versions.py --check

      - name: Verify manifest.yaml.version matches CHANGELOG most-recent release
        working-directory: solutions
        run: python scripts/lint-version-drift.py --strict
        # Strict mode enabled in PR #204 (Wave 5 close-out) — baseline cleaned by PR #203.

      - name: Lint Dataverse Picklist option-set value ranges
        working-directory: solutions
        run: python scripts/lint-optionset-values.py --strict
        # Strict mode enabled in PR #204 (Wave 5 close-out) — baseline is clean (0 findings).
