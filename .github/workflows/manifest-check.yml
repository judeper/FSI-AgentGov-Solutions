name: Manifest Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  manifest-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: solutions

      - name: Checkout framework (controls.json source of truth)
        uses: actions/checkout@v4
        with:
          repository: judeper/FSI-AgentGov
          # Pinned to a framework release tag; bump deliberately. Do NOT use 'main'.
          ref: ${{ vars.FRAMEWORK_REF || 'v1.6.0' }}
          path: fsi-agentgov

      - name: Reject stale framework pillar path segments
        working-directory: solutions
        run: |
          if grep -rE 'pillar-(1-foundation|2-lifecycle|3-monitoring)' --include='*.md' --include='*.yaml' --include='*.yml' . ; then
            echo "Stale pillar path segment found"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install pyyaml jsonschema

      - name: Generate artifacts (writes gitignored site-docs)
        # Generation must run first: site-docs/solutions/** is gitignored and
        # absent from a fresh checkout, so `--check` alone would report those
        # missing files as drift.
        working-directory: solutions
        env:
          FRAMEWORK_CONTROLS: ${{ github.workspace }}/fsi-agentgov/assessment/manifest/controls.json
        run: python scripts/build-manifest.py

      - name: Verify committed artifacts are in sync with manifests
        # THE drift gate. `build-manifest.py --check` cannot serve this purpose
        # after a generate step, because it compares generated content against
        # the files on disk -- which generation has just overwritten, so it
        # would compare generator output to itself and pass unconditionally
        # (issue #205: CI ran a 78-control framework against 79-control
        # committed artifacts and still reported success).
        # git is the right oracle here: tracked artifacts that generation
        # changed show up as a diff, while gitignored site-docs stay invisible.
        working-directory: solutions
        run: |
          if ! git diff --exit-code; then
            echo "::error::Committed generated artifacts are stale. Run 'python scripts/build-manifest.py' and commit the result."
            exit 1
          fi
          untracked="$(git ls-files --others --exclude-standard)"
          if [ -n "$untracked" ]; then
            echo "::error::Generation produced untracked files that are not gitignored:"
            echo "$untracked"
            exit 1
          fi

      - name: Verify generator is deterministic
        # Re-running against the just-generated output must be a no-op.
        working-directory: solutions
        env:
          FRAMEWORK_CONTROLS: ${{ github.workspace }}/fsi-agentgov/assessment/manifest/controls.json
        run: python scripts/build-manifest.py --check

      - name: Verify AGENTS.md and copilot-instructions.md inventory tables match solutions.json
        working-directory: solutions
        run: python scripts/sync-agent-md-versions.py --check

      - name: Verify manifest.yaml.version matches CHANGELOG most-recent release
        working-directory: solutions
        run: python scripts/lint-version-drift.py --strict
        # Strict mode enabled in PR #204 (Wave 5 close-out) — baseline cleaned by PR #203.

      - name: Lint Dataverse Picklist option-set value ranges
        working-directory: solutions
        run: python scripts/lint-optionset-values.py --strict
        # Strict mode enabled in PR #204 (Wave 5 close-out) — baseline is clean (0 findings).
