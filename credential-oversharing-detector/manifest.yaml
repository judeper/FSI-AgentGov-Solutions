id: credential-oversharing-detector
name: Credential Oversharing Detector
description: Scans Copilot Studio agent credentials against zone policy to detect overprivileged connectors, excessive OAuth scopes, unauthorized service accounts, cross-environment sharing, and stale credentials.
version: 2.1.2
status: live
domain: agent-config
tier: '2'
controls:
- '1.14'
- '1.4'
- '1.18'
url: https://judeper.github.io/FSI-AgentGov-Solutions/solutions/credential-oversharing-detector/
prerequisites:
  power-platform-admin: Power Platform admin tenant role and Dataverse environment with the fsi publisher prefix.
verification: Validate host compatibility and connector telemetry against a known agent before interpreting findings; run Invoke-CredentialScan.ps1 with -DataverseUrl and confirm expected scan and seeded violation rows in `fsi_credentialscans` and `fsi_credentialviolations`. Zero connectors is incomplete coverage, not a passing credential review.
upstreamDependency:
  status: preview
  note: Copilot Studio credential-oversharing detection (Microsoft roadmap ID 566873) is listed as In development on the Microsoft AI at Work roadmap (preview target July 2026, general availability target September 2026; status checked 2026-10-16). Public availability is not confirmed; validate in a non-production tenant before regulated production use.

# zones/dataClassification CONFIRMED 2026-Q2 (issue #37):
#   per-connector credential governance applies wherever agents call connectors
zones:
- personal
- team
- enterprise
dataClassification: confidential
