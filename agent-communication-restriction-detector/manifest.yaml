id: agent-communication-restriction-detector
name: Agent Communication Restriction Detector
description: Detects unauthorized agent-to-agent communication patterns, zone boundary violations, cross-tenant communication, and maker/checker violations in Copilot Studio multi-agent orchestration.
version: 1.2.1
status: live
domain: agent-config
tier: '2'
controls:
- '2.17'
url: https://judeper.github.io/FSI-AgentGov-Solutions/solutions/agent-communication-restriction-detector/
prerequisites:
  power-platform-admin: Power Platform admin tenant role and Dataverse environment with the fsi publisher prefix.
verification: Confirm Test-CommRestrictionCompliance.ps1 writes rows to `fsi_CommScanRun` and `fsi_AgentCommViolation`.

# zones/dataClassification CONFIRMED 2026-Q2 (issue #37):
#   multi-agent orchestration policy; only meaningful where multiple users / agents coexist
zones:
- team
- enterprise
dataClassification: internal
