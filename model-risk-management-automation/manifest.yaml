id: model-risk-management-automation
name: Model Risk Management Automation
description: Automated model risk management workflows for AI agents deployed on Power Platform, aligned to OCC Bulletin 2026-13 (formerly OCC Bulletin 2011-12) and Fed SR 26-2 (formerly Fed SR 11-7) principles where applicable. This solution automates model inventory submission, risk scoring, independent validation workflows, ongoing monitoring, and examiner-facing Agent Card generation.
version: 1.0.4
status: live
domain: compliance-audit
tier: '2'
controls:
- '2.6'
- '2.5'
- '2.9'
- '2.11'
- '2.13'
- '3.1'
- '1.2'
url: https://judeper.github.io/FSI-AgentGov-Solutions/solutions/model-risk-management-automation/
prerequisites:
  power-platform-admin: "Power Platform admin tenant role and Dataverse schema deployment access for model inventory and validation tables."
  security-admin: "Entra Global Admin or Application Administrator permissions for managed identity setup and API consent."
  sharepoint-admin: "SharePoint admin rights to create the MRM Governance site and Agent Card library."
verification: "Confirm rows exist in fsi_modelinventory and fsi_validationcycle, and verify the Agent Card file is published in the SharePoint library."

# zones/dataClassification CONFIRMED 2026-Q2 (issue #37):
#   OCC Bulletin 2026-13 (formerly OCC 2011-12) / Fed SR 26-2 (formerly Fed SR 11-7) enterprise model risk
zones:
- enterprise
dataClassification: restricted
