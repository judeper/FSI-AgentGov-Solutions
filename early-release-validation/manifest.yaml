id: early-release-validation
name: Early-Release Validation
description: Pre-promotion resilience validation for Copilot Studio agents. Structural checks for fallback coverage, connector resilience, and error recovery before early-release-ring promotion, packaged as tamper-evident Dataverse evidence.
version: 0.1.0-preview
status: preview
domain: lifecycle-ops
tier: '2'
controls:
- '2.1'
- '2.4'
- '2.8'
- '1.9'
url: https://judeper.github.io/FSI-AgentGov-Solutions/solutions/early-release-validation/
prerequisites:
  power-platform-admin: Power Platform admin to export and unpack the target agent solution (PAC CLI) and to access the early-release ring environment.
  security-admin: Microsoft Entra app registration / admin consent and Dataverse system administrator access for evidence writes.
verification: Run Invoke-EarlyReleaseValidation.ps1 -CheckType AllStructural against an unpacked solution and confirm per-check results print; Export-ValidationEvidence.ps1 produces an fsi_ervalidationresult evidence JSON with a SHA-256 companion file.

# zones/dataClassification: pre-promotion gating is an org-scope governance concern.
zones:
- enterprise
dataClassification: confidential
upstreamDependency:
  status: preview
  note: The three structural checks run today on GA tooling (PAC CLI + solution YAML). Check 4 (EarlyReleaseReadinessCheck) live probe and the early-release-ring environment-config are deferred pending MSCAT "Building Enterprise AI Solutions" Part 2.
