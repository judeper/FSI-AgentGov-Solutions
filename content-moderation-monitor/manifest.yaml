id: content-moderation-monitor
name: Content Moderation Monitor
description: Automated validation of Copilot Studio agent content moderation levels against zone-specific governance requirements.
version: 1.1.0
status: live
domain: content-data
tier: '2'
controls:
- '1.8'
- '1.14'
url: https://judeper.github.io/FSI-AgentGov-Solutions/solutions/content-moderation-monitor/
prerequisites:
  power-platform-admin: Power Platform admin, Dynamics 365 Service Admin, or Global Admin to enumerate environments and read bot records; Dataverse access requires System Administrator or System Customizer in each target environment.
verification: Run Test-ContentModerationCompliance.ps1 -ExcludeSandbox and confirm new rows in fsi_moderationvalidationhistory and fsi_moderationviolations with a matching fsi_validationtime and fsi_runid.
