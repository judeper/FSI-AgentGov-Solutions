# Policy lookup tables for agent-intake v1.0.0-preview foundations
#
# IT administrators set these once during deployment. The classification script
# (`scripts/seed_classification_rules.py`) and the router flows read from this
# file (or a customer-specific Dataverse/config store) to compute tier, zone,
# retention, reviewer routing, and handoff behavior.
#
# Defaults below reflect product-owner decisions captured in
# `research/04-open-questions-resolved.md`. Customers should review and override
# per their firm's policy before pilot or lab rebuild validation.

schema_version: "1.0.0-preview"
last_updated_utc: "2026-05-16T00:00:00Z"

# Cross-border data residency policy (default-deny if maker country differs
# from data residency country; Privacy can override).
data_residency:
  default_action: "deny"        # deny | allow | review
  privacy_override_enabled: true
  privacy_team_upn: "privacy@contoso.com"
  allowed_country_pairs: []     # e.g., [{maker: "US", data: "CA"}]

# InfoSec passive sample rate for Express path.
infosec_sampling:
  express_path_sample_rate: 0.10
  notification_channel: "Teams"    # Teams | Email
  infosec_team_upn: "infosec-agent-review@contoso.com"

# Sponsor approval SLA (days). Beyond this, escalate according to policy.
sponsor_sla:
  initial_response_days: 3
  escalation_after_days: 7
  escalate_to: "manager"           # manager | governance_lead | deny

# Reviewer routing defaults for Standard and Full paths. Override these role
# blocks here (or mirror them into a Dataverse config table) before enabling
# customer-specific reviewer fan-out.
reviewer_routing:
  infosec:
    default_sla_days: 5
    escalation_contact: "infosec-escalations@contoso.com"
    quorum_weight: 1
    conditional_approval_allowed: true
  privacy:
    default_sla_days: 5
    escalation_contact: "privacy-escalations@contoso.com"
    quorum_weight: 1
    conditional_approval_allowed: true
  compliance:
    default_sla_days: 5
    escalation_contact: "compliance-escalations@contoso.com"
    quorum_weight: 1
    conditional_approval_allowed: true
  legal:
    default_sla_days: 7
    escalation_contact: "legal-escalations@contoso.com"
    quorum_weight: 1
    conditional_approval_allowed: false
  mrm:
    default_sla_days: 10
    escalation_contact: "mrm-escalations@contoso.com"
    quorum_weight: 1
    conditional_approval_allowed: true

# Quorum thresholds by tier. Customers can override these minima here before
# they move the defaults into production routing logic.
quorum:
  tier_1:
    minimum_approvals: 3
    total_reviewers: 5
  tier_2:
    minimum_approvals: 2
    total_reviewers: 3
  tier_3:
    minimum_approvals: 1
    total_reviewers: 1

# Model Risk Management handoff defaults. Override this block when the target
# solution name, payload contract, or local fallback queue differs.
mrm:
  handoff_target_solution: "model-risk-management-automation"
  payload_version: "1.0"
  fallback_behavior: "queue-locally"
  fallback_status: "MRMHandoffPending"   # maps to fsi_MrmHandoffStatus = Pending until the downstream target is available

# Routing-topology defaults by tier. `parallel-with-quorum` maps to the schema
# choice `Quorum` plus concurrent reviewer fan-out in the routing flow.
parallel_routing:
  tier_1:
    topology: "parallel"
  tier_2:
    topology: "parallel-with-quorum"
  tier_3:
    topology: "sequential"              # sponsor only

# Retention class mapping (Tier -> Purview retention label).
retention_labels:
  tier_1: "FSI-AgentIntake-7yr"
  tier_2: "FSI-AgentIntake-7yr"
  tier_3: "FSI-AgentIntake-7yr"
  decision_log: "FSI-AgentIntake-7yr-WORM"

# Managed-Environment requirement by tier.
managed_environment:
  tier_1: "required"
  tier_2: "required"
  tier_3: "recommended"

# Power Platform data policy connector group mapping by tier. Values mirror the
# documented policy payload group names: businessDataOnly,
# nonBusinessDataOnly, and blockedConnectors.
dlp_connector_group:
  tier_1: "businessDataOnly"
  tier_2: "businessDataOnly"
  tier_3: "nonBusinessDataOnly"

# Default connector allowlist payload shape used by decision-pack generation and
# downstream drift checks. Populate these arrays with the tenant-approved
# connector names or IDs before production use.
connector_allowlist:
  businessDataOnly: []
  nonBusinessDataOnly: []
  blockedConnectors: []

# Default zone classification rules (Zone 1 = enterprise/highest-risk).
zone_routing:
  zone_1:
    sponsor_required: true
    infosec_required: true
    privacy_required: true
    compliance_required: true
    mrm_required_if_tier_1_or_2: true
  zone_2:
    sponsor_required: true
    infosec_required: "sample"
    privacy_required: false
    compliance_required: false
  zone_3:
    sponsor_required: true
    infosec_required: "sample"
    privacy_required: false
    compliance_required: false

# Audience -> default zone (intake form Q3 maps to zone). Team and enterprise
# audiences route into the richer Standard and Full path question sets.
audience_to_zone:
  "Just me": 3
  "My team": 2
  "My department": 2
  "Anyone in the firm": 1
  "External users": 1

# Modification-cutoff rules (post-approval changes).
modification_cutoff:
  trigger_changes_force_re_review: true
  descriptive_changes_require_sponsor_reconfirm: true

# Denial-appeal defaults by path. ADR-010 used a single-value
# `appeal.max_resubmissions = 1`; keep 1 for Express/Standard and use 2 for
# Full-path honest mistakes unless firm policy requires a stricter cap.
denial_appeal:
  max_resubmissions:
    express: 1
    standard: 1
    full: 2

# Sponsor attestation language (FINRA 3110).
sponsor_attestation:
  card_text: |
    By approving, you confirm that (1) you are the assigned business sponsor
    for this agent, (2) the stated business purpose is legitimate and
    necessary, (3) you accept supervisory responsibility for the agent's
    operation under FINRA Rule 3110, and (4) you will be notified if the
    agent's risk profile materially changes. This approval is recorded as an
    immutable supervisory record retained for 7 years (FINRA 4511, SEC 17a-4,
    CFTC 1.31).
  retention_years: 7
  immutable: true

# Experience components still deferred after the schema/policy foundation work.
deferred:
  standard_path_questions: 20
  full_path_questions: 35
  parallel_reviewer_routing: true
  conversational_intake_via_copilot_studio: true
