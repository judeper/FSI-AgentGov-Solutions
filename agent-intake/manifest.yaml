id: agent-intake
name: Agent Intake
description: "Pre-build maker intake (Express + Standard + Full paths) with sponsor 1-click approval, parallel reviewer quorum, MRM handoff, and Entra Agent ID minting"
version: 1.0.0-preview
status: preview
domain: lifecycle-ops
tier: '1'
controls:
- '1.2'
- '1.7'
- '2.1'
- '2.13'
- '3.1'
url: https://judeper.github.io/FSI-AgentGov-Solutions/solutions/agent-intake/
prerequisites:
  power-platform-admin: Power Platform Admin to deploy Dataverse schema, configure the Power Pages portal, and provision the intake environment for Express, Standard, and Full routing.
  records-management-admin: Microsoft 365 Records Management Admin to create the FSI-AgentIntake-7yr Purview retention label one-time at setup (supports SEC 17a-4, FINRA 4511, CFTC 1.31 retention expectations).
  security-admin: Microsoft Entra Agent ID Administrator, Cloud Application Administrator, or Global Administrator to consent AgentIdentity.CreateAsManager or AgentIdentity.Create.All for the handoff script in tenants where Microsoft Entra Agent ID is available.
  m365-admin: Microsoft 365 admin for Teams notifications (sponsor adaptive card delivery) and Graph /me/manager pre-fill.
verification: "After deployment, run the full agent-intake lab rebuild: submit Express, Standard, and Full path test requests; confirm sponsor and parallel reviewer routing records are written; validate MRM handoff fallback behavior; and confirm handoff to agent-registry-automation creates the registry entry with the minted Microsoft Entra Agent ID service principal."

# Preview foundations now cover personal, team, and enterprise zones; later
# workstreams add the portal and flow runtime experience for Standard and Full paths.
zones:
- personal
- team
- enterprise
dataClassification: confidential
retention: 7 years per SEC 17a-4 / FINRA 4511 / CFTC 1.31 (decision-pack records); customer records teams must validate exact retention settings and legal-hold handling.
