id: agent-registry-automation
name: Agent Registry Automation
description: Automated discovery, registration, approval, and lifecycle governance of AI agents across Power Platform.
version: 2.1.1
status: live
domain: lifecycle-ops
tier: '2'
controls:
- '1.2'
- '1.7'
- '2.1'
- '2.13'
url: https://judeper.github.io/FSI-AgentGov-Solutions/solutions/agent-registry-automation/
prerequisites:
  power-platform-admin: Power Platform admin for environment enumeration, Dataverse deployment, and flow creation.
  security-admin: Entra Global Admin/Application Administrator for app registration, admin consent, and Graph permissions.
  m365-admin: Microsoft 365 admin for Teams notifications and owner-status lookups.
verification: Confirm Test-AgentRegistryCompliance.ps1 succeeds and the inventory pipeline records a new compliance event.

# zones/dataClassification CONFIRMED 2026-Q2 (issue #37):
#   registry of all agents; spans every zone
zones:
- personal
- team
- enterprise
dataClassification: internal
